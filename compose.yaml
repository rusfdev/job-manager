# Local development database. Credentials are for this container only.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: job_manager
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_manager -h 127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s
    volumes:
      # Postgres 18+ keeps data under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
